<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[Tong] 3D Reconstruction Test</title>
    <link rel="stylesheet" href="3d_reconstruction_test.css" />
    <!-- three.js comes from a CDN, so there is nothing to install -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- frame that shows up when the camera sits where a photo was taken -->
    <div id="frame" hidden><span id="frame-label"></span></div>

    <!-- the real photo, shown first every time you switch scenes -->
    <div id="photo" hidden>
      <img alt="Photo the scene was rebuilt from" />
      <span id="photo-label"></span>
    </div>

    <header id="info">
      <a id="home" href="../index.html">Home</a>
      <h1>3D Reconstruction Test</h1>
      <p>
        Low-poly guesses at places around school, rebuilt with three.js from
        photos and drone footage.
      </p>
    </header>

    <nav id="controls">
      <h3>Scene</h3>
      <div id="scenes" class="buttons">
        <button data-scene="gate">1 · Old Gate</button>
        <button data-scene="studio">2 · ID Studio</button>
        <button data-scene="main">3 · Main Gate</button>
      </div>
      <h3>Display</h3>
      <div id="modes" class="buttons">
        <button data-mode="photo">Photo</button>
        <button data-mode="lowpoly" class="active">Low-poly</button>
        <button data-mode="wire">Wireframe</button>
      </div>
      <h3>View</h3>
      <!-- views and layers are filled in by the script for the scene on screen -->
      <div id="views" class="buttons"></div>
      <h3>Show</h3>
      <div id="layers"></div>
    </nav>

    <p id="hint">Drag to orbit · scroll to zoom · right-drag to pan</p>

    <script type="module" src="3d_reconstruction_test.js"></script>
  </body>
</html>
