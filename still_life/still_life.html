<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[Tong] Still Life</title>
    <link rel="stylesheet" href="still_life.css" />
  </head>
  <body>
    <a id="home" href="https://yimainiu.github.io/interactive-1/index.html"
      >Home</a
    >

    <!--
      Canvas. Every child is a full-size layer that gets cut down by a
      clip-path polygon, so all coordinates live in one shared 0-100% grid.
      DOM order = paint order: first element is furthest back.
    -->
    <main>
      <!-- Table -->
      <div class="shape" id="table"></div>
      <div class="shape" id="tablecloth"></div>

      <!-- Blue bottle -->
      <div class="shape" id="bottle-body"></div>
      <div class="shape" id="bouquet"></div>

      <!-- Delicata squash, lying down in front -->
      <div class="shape" id="delicata"></div>

      <!-- Pumpkin -->
      <div class="shape" id="pumpkin-stalk"></div>
      <div class="shape" id="pumpkin-body"></div>

      <!-- Tall pumpkin -->
      <div class="shape" id="tall-pumpkin-stalk"></div>
      <div class="shape" id="tall-pumpkin-body"></div>
    </main>
  </body>
</html>
